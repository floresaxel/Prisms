packages:
  - 'packages/*'
  - 'apps/*'
allowBuilds:
  unrs-resolver: true
  esbuild: true
  better-sqlite3: true
  '@journeyapps/wa-sqlite': true
# drizzle-orm has several optional peers (kysely via better-auth, pg via
# pg-boss). Each present peer makes pnpm materialize a SEPARATE drizzle-orm
# instance whose types clash with @prisms/db's instance. We only use the
# postgres-js driver, so drop those peer edges to keep one drizzle-orm.
overrides:
  'drizzle-orm>kysely': '-'
  'drizzle-orm>pg': '-'
# S9-F3: no workspace-wide `react` override. @prisms/ui declares react as a
# PEER dependency, so each app supplies its own single React instance — web its
# 19.2.x, mobile Expo 53's 19.0.x (the supported RN 0.79 pairing) — instead of
# force-resolving 19.2.7 under React Native, which was an unsupported pairing.
