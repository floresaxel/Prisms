packages:
  - 'packages/*'
  - 'apps/*'
allowBuilds:
  unrs-resolver: true
  esbuild: true
  better-sqlite3: true
  '@journeyapps/wa-sqlite': true
# drizzle-orm has several optional peers (kysely via better-auth, pg via
# pg-boss). Each present peer makes pnpm materialize a SEPARATE drizzle-orm
# instance whose types clash with @prisms/db's instance. We only use the
# postgres-js driver, so drop those peer edges to keep one drizzle-orm.
overrides:
  'drizzle-orm>kysely': '-'
  'drizzle-orm>pg': '-'
  # one React across web (19.2) + mobile (Expo pins 19.0) so the shared
  # @prisms/ui hooks resolve to a single React instance.
  react: '19.2.7'
