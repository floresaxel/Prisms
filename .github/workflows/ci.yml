name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Lint, typecheck, test, coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, test (all packages — incl. mobile + desktop TS)
        run: pnpm turbo lint typecheck test

      - name: Core coverage gate (§16 floor — lines/functions/statements ≥ 90%)
        run: pnpm --filter @prisms/core test:coverage

      - name: Build web app (Vite bundle + PWA service worker)
        run: pnpm --filter @prisms/web build

  stack:
    name: DB + API against compose postgres/powersync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Boot postgres (fresh volumes)
        run: docker compose up -d --wait postgres

      # The initdb script creates the PowerSync publication EMPTY; migration
      # 0009 scopes it to the synced tables (S6-F4) — and PowerSync snapshots
      # the schema at boot, so migrate the prisms db before it starts (same
      # ordering the e2e job uses).
      - name: Apply migrations (publication + tables exist before PowerSync boots)
        run: pnpm --filter @prisms/db db:migrate

      - name: Boot PowerSync (after the tables exist)
        run: docker compose up -d --wait powersync

      - name: DB tests (migrations, seed, invariant backstops)
        run: pnpm --filter @prisms/db test
        env:
          PRISMS_DB_TEST_URL: postgresql://prisms:prisms_dev_password@localhost:5432/postgres

      - name: Server tests (auth, PowerSync JWT, dispatcher, convergence, jobs)
        run: pnpm --filter @prisms/server test
        env:
          PRISMS_DB_TEST_URL: postgresql://prisms:prisms_dev_password@localhost:5432/postgres
          PRISMS_POWERSYNC_URL: http://localhost:8080

      - name: Tear down
        if: always()
        run: docker compose down -v

  e2e:
    # Runs every apps/web/e2e/*.spec.ts: the v1.0 behavioural suite (dod, s16–s20)
    # PLUS the v1.4 surface — m9 (suggestions/provenance/force clock-in), m10
    # (review inbox + freshness), m13 (import/export round-trip), and v14 (§7.15
    # read-path: no empty-then-fill flash + warm synchronous tab revisit).
    name: Web Playwright e2e (offline + convergence + graph/rules + read-path + portability) vs live stack
    runs-on: ubuntu-latest
    # The web client's default powersyncUrl (:8080) matches compose's default
    # container mapping — no port remap needed (audit S1-F7/S9-F4).
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Boot postgres (fresh volumes)
        run: docker compose up -d --wait postgres

      - name: Apply migrations (before PowerSync starts, so it snapshots a populated schema)
        run: pnpm --filter @prisms/db db:migrate

      # PowerSync replicates via logical replication and snapshots the schema at
      # boot; starting it after the migrations guarantees it replicates the app
      # tables down to the client (otherwise sync delivers nothing and every e2e
      # times out waiting for seeded data).
      - name: Boot PowerSync (after the tables exist)
        run: docker compose up -d --wait powersync

      - name: Build web (production bundle for vite preview)
        run: pnpm --filter @prisms/web build

      - name: Install Playwright Chromium
        run: pnpm --filter @prisms/web exec playwright install --with-deps chromium

      - name: Start API (jobs on, so the s20 automation backstop fires)
        run: pnpm --filter @prisms/server start &
        env:
          PORT: '3001'
          BETTER_AUTH_URL: http://localhost:5173
          BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:5173
          PRISMS_JOBS_ENABLED: 'true'

      - name: Start web (vite preview)
        run: pnpm --filter @prisms/web preview &

      - name: Wait for API + web
        run: |
          npx --yes wait-on http://localhost:3001/health http://localhost:5173 --timeout 60000

      - name: Run Playwright e2e
        run: pnpm --filter @prisms/web e2e

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: docker compose down -v

  # Mobile (Maestro on an Android/iOS emulator) and desktop (tauri-driver on a
  # packaged build, needs the Rust toolchain) e2e are device/toolchain-bound and
  # run on self-hosted/dedicated runners — flows live in apps/mobile/.maestro and
  # apps/desktop/e2e. The TS for both is gate-checked in the `checks` job above.
