# PowerSync service configuration.
# /sync-rules.yaml is bind-mounted from packages/db/sync-rules.yaml
# (see docker-compose.yml).
#
# client_auth: the API signs short-lived HS256 JWTs with this shared dev key
# (apps/server GET /api/powersync/token, §13). Override the key everywhere via
# POWERSYNC_JWT_SECRET when deploying.
# TODO(s23): production hardening — rotate to API-served JWKS (RS256).
replication:
  connections:
    - type: postgresql
      uri: postgresql://prisms:prisms_dev_password@postgres:5432/prisms
      sslmode: disable

storage:
  type: postgresql
  uri: postgresql://prisms:prisms_dev_password@postgres:5432/powersync_storage
  sslmode: disable

port: 8080

sync_rules:
  path: /sync-rules.yaml

client_auth:
  # Dev-only HS256 key ("prisms-dev-secret-change-me-32by"); never use in production.
  jwks:
    keys:
      - kty: oct
        alg: HS256
        kid: powersync-dev
        k: cHJpc21zLWRldi1zZWNyZXQtY2hhbmdlLW1lLTMyYnk
  audience: ['powersync-dev']
