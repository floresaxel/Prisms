# PowerSync service — production config (docker-compose.prod.yml). All secrets
# come from the environment (see .env.example) via the `!env` tag, so nothing
# sensitive lives in the repo. The HS256 key here MUST be the base64url of the
# API's POWERSYNC_JWT_SECRET (the API signs short-lived tokens with that secret;
# §13). TODO: rotate to API-served JWKS (RS256) for key rotation without redeploy.
replication:
  connections:
    - type: postgresql
      uri: !env PS_DATABASE_URI
      sslmode: disable

storage:
  type: postgresql
  uri: !env PS_STORAGE_URI
  sslmode: disable

port: 8080

sync_rules:
  path: /sync-rules.yaml

client_auth:
  jwks:
    keys:
      - kty: oct
        alg: HS256
        kid: !env POWERSYNC_JWT_KID
        k: !env POWERSYNC_JWT_K_B64URL
  audience: [!env POWERSYNC_JWT_AUDIENCE]
