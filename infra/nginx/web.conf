# Serves the SPA and keeps the browser single-origin: /api + /sync reach the
# API, /powersync reaches the sync service (incl. WebSocket upgrade), and every
# other path falls back to the cached app shell (SPA + offline).

# SEC-5/F15: HSTS, emitted only when the request actually arrived over TLS.
# This container listens on plain :80 behind a terminator (Tailscale/reverse
# proxy), so an unconditional header would be a no-op on direct HTTP and could
# be cached oddly — which is why it sat commented out and therefore never
# shipped at all. Keying it on the terminator's X-Forwarded-Proto makes it
# automatic for real HTTPS deployments and absent otherwise. nginx omits an
# add_header whose value is the empty string.
map $http_x_forwarded_proto $prisms_hsts {
  https   "max-age=31536000; includeSubDomains";
  default "";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # --- security headers (audit S10-F4; tightened SEC-5) ----------------------
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # SPA + PowerSync WS + wa-sqlite WASM. 'wasm-unsafe-eval' is required for the
  # wa-sqlite module.
  #
  # SEC-5/F8: connect-src was "'self' ws: wss:". Bare ws:/wss: are SCHEME sources
  # — they match ANY host, so any script that got a foothold could open a socket
  # to an attacker's server and stream the replica out. The browser reaches
  # PowerSync through this same nginx at /powersync (see the location below), so
  # same-origin covers it: 'self' already permits ws://<this-origin> and
  # wss://<this-origin> for the upgrade. If you ever point VITE_POWERSYNC_URL at
  # a DIFFERENT origin, add exactly that origin here (e.g. wss://sync.example.com)
  # rather than restoring a bare scheme.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  add_header Strict-Transport-Security $prisms_hsts always;

  # --- client-IP provenance (SEC-2/F1) ---------------------------------------
  # These headers are the ONLY thing standing between the auth brute-force
  # limiter and an attacker, so they must not be attacker-writable.
  #
  # This used to be `X-Forwarded-For $proxy_add_x_forwarded_for`, which APPENDS
  # $remote_addr to whatever XFF the client sent. better-auth resolves the client
  # IP as `xff.split(",")[0]` (dist/utils/get-request-ip.mjs), i.e. the FIRST
  # element — the one the client controls. Rotating that header per request gave
  # every guess a fresh rate-limit bucket, so the 3-per-10s sign-in cap never
  # fired and online password guessing was unbounded.
  #
  # Both headers are now OVERWRITTEN with the peer address nginx actually
  # observed; proxy_set_header replaces any client-supplied copy.
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;

  # If (and ONLY if) another proxy sits in front of this one and you trust it to
  # append an accurate XFF, uncomment and set its address(es) — nginx will then
  # derive $remote_addr from that chain and the overwrite above stays correct.
  # Do NOT enable this for a proxy that forwards client-supplied XFF verbatim:
  # that hands the bucket key straight back to the attacker.
  #   set_real_ip_from 127.0.0.1;
  #   set_real_ip_from 100.64.0.0/10;   # Tailscale CGNAT range
  #   real_ip_header X-Forwarded-For;
  #   real_ip_recursive on;

  # cookie-bearing auth + command upload → API
  location /api/  { proxy_pass http://api:3001; }
  location /sync/ { proxy_pass http://api:3001; }

  # PowerSync sync stream (WebSocket upgrade)
  location /powersync/ {
    proxy_pass http://powersync:8080/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400s;
  }

  # Hashed build assets are immutable — cache hard (audit S10-F4).
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # The shell + service worker must always revalidate so deploys take effect
  # (the SW handles offline; stale-shell caching would pin old bundles).
  # nginx quirk: add_header in a location DROPS the server-level set, so the
  # security headers are repeated here — index.html is the document CSP applies to.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security $prisms_hsts always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  }
  location = /sw.js {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # SPA fallback (the service worker precaches the shell for offline)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
