# Serves the SPA and keeps the browser single-origin: /api + /sync reach the
# API, /powersync reaches the sync service (incl. WebSocket upgrade), and every
# other path falls back to the cached app shell (SPA + offline).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # --- security headers (audit S10-F4) ---------------------------------------
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # SPA + PowerSync WS + wa-sqlite WASM. 'wasm-unsafe-eval' is required for the
  # wa-sqlite module; connect-src covers same-origin API/sync + the WS upgrade.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws: wss:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  # Enable once TLS is terminated in front of this server (Tailscale/reverse
  # proxy) — sending HSTS over plain HTTP is a no-op browsers may cache oddly:
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # --- client-IP provenance (SEC-2/F1) ---------------------------------------
  # These headers are the ONLY thing standing between the auth brute-force
  # limiter and an attacker, so they must not be attacker-writable.
  #
  # This used to be `X-Forwarded-For $proxy_add_x_forwarded_for`, which APPENDS
  # $remote_addr to whatever XFF the client sent. better-auth resolves the client
  # IP as `xff.split(",")[0]` (dist/utils/get-request-ip.mjs), i.e. the FIRST
  # element — the one the client controls. Rotating that header per request gave
  # every guess a fresh rate-limit bucket, so the 3-per-10s sign-in cap never
  # fired and online password guessing was unbounded.
  #
  # Both headers are now OVERWRITTEN with the peer address nginx actually
  # observed; proxy_set_header replaces any client-supplied copy.
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;

  # If (and ONLY if) another proxy sits in front of this one and you trust it to
  # append an accurate XFF, uncomment and set its address(es) — nginx will then
  # derive $remote_addr from that chain and the overwrite above stays correct.
  # Do NOT enable this for a proxy that forwards client-supplied XFF verbatim:
  # that hands the bucket key straight back to the attacker.
  #   set_real_ip_from 127.0.0.1;
  #   set_real_ip_from 100.64.0.0/10;   # Tailscale CGNAT range
  #   real_ip_header X-Forwarded-For;
  #   real_ip_recursive on;

  # cookie-bearing auth + command upload → API
  location /api/  { proxy_pass http://api:3001; }
  location /sync/ { proxy_pass http://api:3001; }

  # PowerSync sync stream (WebSocket upgrade)
  location /powersync/ {
    proxy_pass http://powersync:8080/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400s;
  }

  # Hashed build assets are immutable — cache hard (audit S10-F4).
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # The shell + service worker must always revalidate so deploys take effect
  # (the SW handles offline; stale-shell caching would pin old bundles).
  # nginx quirk: add_header in a location DROPS the server-level set, so the
  # security headers are repeated here — index.html is the document CSP applies to.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws: wss:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  }
  location = /sw.js {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # SPA fallback (the service worker precaches the shell for offline)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
