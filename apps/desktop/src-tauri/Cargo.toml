[package]
name = "prisms-desktop"
version = "0.1.0"
description = "Prisms desktop (Tauri v2 shell around the web build)"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "prisms_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
