# PowerSync sync rules (ARCHITECTURE.md §7.3 down-sync).
#
# One global bucket per user: every table except command_log, scoped by the
# authenticated user id from the JWT. external_facts and computed_aggregates
# flow down like any rows. Versioned alongside the schema (§16) — additive
# changes only.
bucket_definitions:
  user_data:
    parameters: SELECT request.user_id() AS user_id
    data:
      - SELECT * FROM nodes WHERE user_id = bucket.user_id
      - SELECT * FROM edges WHERE user_id = bucket.user_id
      - SELECT * FROM schedule_blocks WHERE user_id = bucket.user_id
      - SELECT * FROM time_entries WHERE user_id = bucket.user_id
      - SELECT * FROM habits WHERE user_id = bucket.user_id
      - SELECT * FROM habit_completions WHERE user_id = bucket.user_id
      - SELECT * FROM decision_boards WHERE user_id = bucket.user_id
      - SELECT * FROM decision_criteria WHERE user_id = bucket.user_id
      - SELECT * FROM decision_scores WHERE user_id = bucket.user_id
      - SELECT * FROM sprints WHERE user_id = bucket.user_id
      - SELECT * FROM sprint_memberships WHERE user_id = bucket.user_id
      - SELECT * FROM automation_rules WHERE user_id = bucket.user_id
      - SELECT * FROM blocker_rules WHERE user_id = bucket.user_id
      - SELECT * FROM external_facts WHERE user_id = bucket.user_id
      - SELECT * FROM computed_aggregates WHERE user_id = bucket.user_id
      - SELECT * FROM diagram_layouts WHERE user_id = bucket.user_id
      - SELECT * FROM diagram_groups WHERE user_id = bucket.user_id
      # PK is user_id; PowerSync requires an `id` column on synced rows.
      - SELECT user_id AS id, day_reset_hour, timezone, weather_location, updated_at FROM user_settings WHERE user_id = bucket.user_id
