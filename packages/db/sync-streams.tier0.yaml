# M0 spike — Sync Streams tiering DRAFT (1.3 §7.3).
#
# NOT the production config: the live app still uses sync-rules.yaml (the single
# per-user bucket). This file de-risks the M4 migration by proving, with the
# exact PowerSync rules engine, that the existing stack carries a TIERED,
# JWT-scoped definition for the M0 slice (`nodes`) with NO client-widenable
# parameters.
#
# Tiering (M4 lands all three over every table):
#   Tier 0 (bootstrap) — the working set needed for first paint (nodes, settings).
#   Tier 1 (active)    — the rest of the live, non-deleted facts.
#   Tier 2 (history)   — completed/old/large rows, subscribed lazily (M4).
#
# Scope: parameters derive ONLY from request.user_id() — a verified JWT claim.
# No client-supplied stream parameter is read, so a client cannot widen its
# bucket and one user can never receive another's rows.
bucket_definitions:
  tier0_bootstrap:
    # JWT-scoped: the user id comes from the verified token, not from the client.
    parameters: SELECT request.user_id() AS user_id
    data:
      - SELECT * FROM nodes WHERE user_id = bucket.user_id
      - SELECT user_id AS id, day_reset_hour, timezone, weather_location, updated_at FROM user_settings WHERE user_id = bucket.user_id

  tier1_active:
    parameters: SELECT request.user_id() AS user_id
    data:
      - SELECT * FROM edges WHERE user_id = bucket.user_id
      - SELECT * FROM schedule_blocks WHERE user_id = bucket.user_id
      - SELECT * FROM time_entries WHERE user_id = bucket.user_id
      # M4 adds the filtered command-result + sync_review_items streams here
      # (the durable inbox table lands in M3).
