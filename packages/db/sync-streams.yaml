# PowerSync Sync Streams (ARCHITECTURE_1.3 §7.3). Replaces the v1.0 single
# per-user bucket (legacy Sync Rules). Compiled streams (edition 3).
#
# Access control is the verified JWT user id — every query filters on
# `auth.user_id()`. Streams MAY read a client SUBSCRIPTION parameter (the
# `journal_month` stream matches `month_key`), but the invariant is: a parameter
# only ever NARROWS within the user's own rows — it never replaces or widens the
# `auth.user_id()` filter, so one user can never receive another's rows. Auth-level
# / unauthenticated request parameters are never used (those could bypass scoping).
#
# Tiers (clients auto-subscribe to 0/1; Tier 2 is subscribed lazily, M12/M14):
#   bootstrap  (Tier 0) — the cold-start working set: settings, the LIVE tree,
#                         the agenda, dependencies, suggestion batches, review inbox.
#   active     (Tier 1) — the rest of the LIVE working set.
#   history    (Tier 2) — archival rows, subscribed on demand. Carries the
#                         soft-deleted tombstones of the high-volume tables
#                         (nodes/edges/blocks/completions/layouts/time entries),
#                         so a fresh account's auto-subscribed tiers hold only
#                         live rows and Tier 2 is genuinely non-empty over time.
#
# S6-F1 (R10): the auto-subscribed tiers now filter `deleted_at IS NULL` on the
# high-volume tables and their tombstones move to `history`, so cold-start no
# longer replicates 90 days of soft-deleted rows. NOTE (deferred to Annex A5):
# tiering *live* archival data by age (old closed time entries, completed/archived
# subtrees) is NOT done here — PowerSync sync-rule buckets do not re-evaluate a
# time predicate as rows age (a `now() - interval` filter only bins a row at write
# time), so age-based archival needs a materialized `archived` flag maintained by a
# job (A5 history-compaction) plus client lazy-subscription wiring. Doing it with a
# raw time predicate would silently keep old rows in Tier 1 forever.
config:
  edition: 3

streams:
  bootstrap:
    auto_subscribe: true
    queries:
      # The one EXPLICIT column list in this file (no wildcard): a settings
      # column not named here never reaches a client, so its toggle is dead on
      # arrival and the client renders its own default forever.
      - SELECT user_id AS id, day_reset_hour, timezone, weather_location, journal_day_log, updated_at FROM user_settings WHERE user_id = auth.user_id()
      - SELECT * FROM nodes WHERE user_id = auth.user_id() AND deleted_at IS NULL
      - SELECT * FROM edges WHERE user_id = auth.user_id() AND deleted_at IS NULL
      - SELECT * FROM schedule_blocks WHERE user_id = auth.user_id() AND deleted_at IS NULL
      - SELECT * FROM schedule_suggestion_batches WHERE user_id = auth.user_id()
      - SELECT * FROM sprints WHERE user_id = auth.user_id()
      - SELECT * FROM sprint_memberships WHERE user_id = auth.user_id()
      - SELECT * FROM sync_review_items WHERE user_id = auth.user_id()

  active:
    auto_subscribe: true
    queries:
      - SELECT * FROM time_entries WHERE user_id = auth.user_id() AND deleted_at IS NULL
      - SELECT * FROM habits WHERE user_id = auth.user_id()
      - SELECT * FROM habit_completions WHERE user_id = auth.user_id() AND deleted_at IS NULL
      - SELECT * FROM task_steps WHERE user_id = auth.user_id() AND deleted_at IS NULL
      - SELECT * FROM tags WHERE user_id = auth.user_id()
      - SELECT * FROM tag_placements WHERE user_id = auth.user_id()
      - SELECT * FROM tag_answers WHERE user_id = auth.user_id()
      - SELECT * FROM decision_boards WHERE user_id = auth.user_id()
      - SELECT * FROM decision_criteria WHERE user_id = auth.user_id()
      - SELECT * FROM decision_scores WHERE user_id = auth.user_id()
      - SELECT * FROM automation_rules WHERE user_id = auth.user_id()
      - SELECT * FROM blocker_rules WHERE user_id = auth.user_id()
      - SELECT * FROM external_facts WHERE user_id = auth.user_id()
      - SELECT * FROM computed_aggregates WHERE user_id = auth.user_id()
      - SELECT * FROM diagram_groups WHERE user_id = auth.user_id()
      - SELECT * FROM diagram_layouts WHERE user_id = auth.user_id() AND deleted_at IS NULL

  # Tier 2 — lazily subscribed archival history (M14 `subscribeHistory()` wires
  # the client). The soft-deleted tombstones of the high-volume tables live here,
  # so the auto-subscribed tiers above never replicate them on cold-start.
  # (`command_results` was dropped — S6-F2: it synced the full 90-day command_log
  # to every device with no client table to read it; the upload response contract
  # already closes the reconciliation loop.)
  history:
    auto_subscribe: false
    queries:
      - SELECT * FROM nodes WHERE user_id = auth.user_id() AND deleted_at IS NOT NULL
      - SELECT * FROM edges WHERE user_id = auth.user_id() AND deleted_at IS NOT NULL
      - SELECT * FROM schedule_blocks WHERE user_id = auth.user_id() AND deleted_at IS NOT NULL
      - SELECT * FROM time_entries WHERE user_id = auth.user_id() AND deleted_at IS NOT NULL
      - SELECT * FROM habit_completions WHERE user_id = auth.user_id() AND deleted_at IS NOT NULL
      - SELECT * FROM task_steps WHERE user_id = auth.user_id() AND deleted_at IS NOT NULL
      - SELECT * FROM diagram_layouts WHERE user_id = auth.user_id() AND deleted_at IS NOT NULL
      - SELECT * FROM journal_entries WHERE user_id = auth.user_id() AND deleted_at IS NOT NULL

  # Journal — lazy, MONTH-BUCKETED (J1/D3). auto_subscribe:false + a subscription
  # parameter (month_key equality) means a fresh device pulls ZERO journal rows
  # until the client subscribes a month (the Agenda holds the visible month(s), M-
  # series stream API). The parameter only NARROWS within the user's own rows —
  # the query still filters auth.user_id() (see the header invariant). The exact
  # `subscription.parameters() ->> 'month'` syntax is J0-confirmed compiling +
  # activating on powersync-service 1.22.0 (Blueprints/JOURNAL_PLAN.md, J0 findings).
  journal_month:
    auto_subscribe: false
    queries:
      - SELECT * FROM journal_entries WHERE user_id = auth.user_id() AND deleted_at IS NULL AND month_key = subscription.parameters() ->> 'month'
